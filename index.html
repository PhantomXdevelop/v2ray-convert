<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V2Ray Converter</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Vazirmatn', sans-serif;
  background: #0d1117;
  color: #e2e8f0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px;
  background: #161b22;
  border-bottom: 1px solid #21262d;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-icon {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, #00d4ff, #7c3aed);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}

.header-title {
  font-size: 1rem;
  font-weight: 700;
  background: linear-gradient(90deg, #00d4ff, #7c3aed);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.github-link {
  color: #6e7681;
  transition: color 0.2s;
  display: flex;
  align-items: center;
}
.github-link:hover { color: #e2e8f0; }

/* Main layout */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 20px;
  gap: 16px;
  max-width: 1200px;
  width: 100%;
  margin: 0 auto;
}

.panels {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  flex: 1;
}

@media (max-width: 700px) {
  .panels { grid-template-columns: 1fr; }
  .actions { flex-direction: column; }
}

.panel {
  display: flex;
  flex-direction: column;
  background: #161b22;
  border: 1px solid #21262d;
  border-radius: 12px;
  overflow: hidden;
  min-height: 320px;
}

.panel-header {
  padding: 10px 16px;
  background: #1c2128;
  border-bottom: 1px solid #21262d;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: #8b949e;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.panel-header span { display: flex; align-items: center; gap: 6px; }

.line-count {
  font-size: 0.7rem;
  color: #484f58;
  font-weight: 400;
}

textarea {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  padding: 14px 16px;
  color: #e2e8f0;
  font-family: 'Courier New', monospace;
  font-size: 0.78rem;
  resize: none;
  line-height: 1.6;
  direction: ltr;
  text-align: left;
}

textarea::placeholder { color: #484f58; }

/* Action buttons */
.actions {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1fr;
  gap: 8px;
}

@media (max-width: 700px) {
  .actions { grid-template-columns: 1fr 1fr; }
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 11px 8px;
  border-radius: 8px;
  border: none;
  font-family: 'Vazirmatn', sans-serif;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.18s;
  white-space: nowrap;
}

.btn:hover { filter: brightness(1.15); transform: translateY(-1px); }
.btn:active { transform: translateY(0); filter: brightness(0.95); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

.btn-cyan   { background: linear-gradient(135deg, #00d4ff, #0099bb); color: #000; }
.btn-purple { background: linear-gradient(135deg, #7c3aed, #5b21b6); color: #fff; }
.btn-gray   { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
.btn-gray:hover { background: #2d333b; }
.btn-green  { background: #1a4731; color: #3fb950; border: 1px solid #238636; }
.btn-green:hover { background: #1f5c3e; }
.btn-red    { background: transparent; color: #f85149; border: none; font-size: 0.78rem; }
.btn-red:hover { color: #ff7b72; background: rgba(248,81,73,0.08); border-radius: 6px; }

.btn-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.btn-row-left { display: flex; gap: 8px; }
.btn-row-right { display: flex; gap: 8px; }

/* Status toast */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: #21262d;
  border: 1px solid #30363d;
  color: #e2e8f0;
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 0.85rem;
  transition: transform 0.3s ease;
  z-index: 999;
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { border-color: #238636; color: #3fb950; }
.toast.error { border-color: #f85149; color: #f85149; }

/* Drag over */
.panel.dragover { border-color: #00d4ff; background: rgba(0,212,255,0.03); }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo-icon">🔗</div>
    <span class="header-title">V2Ray Converter</span>
  </div>
  <a href="https://github.com/Mohsen30phantom" target="_blank" class="github-link">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.385-1.335-1.755-1.335-1.755-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 21.795 24 17.295 24 12c0-6.63-5.37-12-12-12z"/>
    </svg>
  </a>
</header>

<div class="main">
  <div class="panels">
    <!-- OUTPUT -->
    <div class="panel" id="outputPanel">
      <div class="panel-header">
        <span>📤 OUTPUT</span>
        <span class="line-count" id="outCount"></span>
      </div>
      <textarea id="output" placeholder="Result will appear here..." readonly></textarea>
    </div>

    <!-- INPUT -->
    <div class="panel" id="inputPanel">
      <div class="panel-header">
        <span>📥 INPUT</span>
        <span class="line-count" id="inCount"></span>
      </div>
      <textarea id="input" placeholder="Paste JSON config or V2Ray links here...&#10;&#10;یا فایل رو اینجا drag & drop کن" oninput="updateCount()"></textarea>
    </div>
  </div>

  <!-- Actions row 1 -->
  <div class="actions">
    <button class="btn btn-cyan" onclick="linksToJson()">← Links → JSON</button>
    <button class="btn btn-purple" onclick="jsonToLinks()">JSON → Links →</button>
    <button class="btn btn-gray" onclick="loadFile()">📂 Load File</button>
    <button class="btn btn-gray" onclick="decodeBase64()">🔓 Decode Base64</button>
  </div>

  <!-- Actions row 2 -->
  <div class="btn-row">
    <div class="btn-row-left">
      <button class="btn btn-green" onclick="downloadOutput()">⬇ Download</button>
      <button class="btn btn-gray" onclick="copyOutput()">📋 Copy</button>
      <button class="btn btn-gray" onclick="encodeSubscription()">🔒 Encode to Subscription</button>
    </div>
    <div class="btn-row-right">
      <button class="btn btn-red" onclick="clearOutput()">Clear Output ✕</button>
      <button class="btn btn-red" onclick="clearInput()">Clear ✕</button>
    </div>
  </div>
</div>

<!-- Hidden file input -->
<input type="file" id="fileInput" accept=".json,.txt,*" style="display:none" onchange="onFileSelected(event)">

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ─── Toast ───────────────────────────────────────────────────────
function toast(msg, type='success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  setTimeout(() => el.className = 'toast', 2500);
}

// ─── Count lines ──────────────────────────────────────────────────
function updateCount() {
  const inp = document.getElementById('input').value.trim();
  const out = document.getElementById('output').value.trim();
  document.getElementById('inCount').textContent = inp ? inp.split('\n').length + ' lines' : '';
  document.getElementById('outCount').textContent = out ? out.split('\n').filter(l=>l.trim()).length + ' lines' : '';
}

// ─── Load File ────────────────────────────────────────────────────
function loadFile() { document.getElementById('fileInput').click(); }

function onFileSelected(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('input').value = ev.target.result;
    updateCount();
    toast('فایل لود شد: ' + file.name);
  };
  reader.readAsText(file);
  e.target.value = '';
}

// Drag & drop on input panel
const inputPanel = document.getElementById('inputPanel');
inputPanel.addEventListener('dragover', e => { e.preventDefault(); inputPanel.classList.add('dragover'); });
inputPanel.addEventListener('dragleave', () => inputPanel.classList.remove('dragover'));
inputPanel.addEventListener('drop', e => {
  e.preventDefault();
  inputPanel.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('input').value = ev.target.result;
    updateCount();
    toast('فایل لود شد: ' + file.name);
  };
  reader.readAsText(file);
});

// ─── Clear ────────────────────────────────────────────────────────
function clearOutput() { document.getElementById('output').value = ''; updateCount(); }
function clearInput()  { document.getElementById('input').value = '';  updateCount(); }

// ─── Copy / Download ──────────────────────────────────────────────
function copyOutput() {
  const val = document.getElementById('output').value;
  if (!val.trim()) return toast('خروجی خالیه!', 'error');
  navigator.clipboard.writeText(val).then(() => toast('کپی شد! ✅'));
}

function downloadOutput() {
  const val = document.getElementById('output').value;
  if (!val.trim()) return toast('خروجی خالیه!', 'error');
  const blob = new Blob([val], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'v2ray-output.txt';
  a.click();
  toast('دانلود شد! ⬇');
}

// ─── Decode Base64 ────────────────────────────────────────────────
function decodeBase64() {
  const inp = document.getElementById('input').value.trim();
  if (!inp) return toast('ابتدا محتوا را وارد کن', 'error');
  try {
    const decoded = atob(inp.replace(/\s/g, ''));
    document.getElementById('output').value = decoded;
    updateCount();
    toast('Base64 دیکود شد ✅');
  } catch(e) {
    toast('محتوا Base64 معتبر نیست!', 'error');
  }
}

// ─── Encode to Subscription ───────────────────────────────────────
function encodeSubscription() {
  const inp = document.getElementById('output').value.trim() || document.getElementById('input').value.trim();
  if (!inp) return toast('ابتدا محتوا را وارد کن', 'error');
  const encoded = btoa(unescape(encodeURIComponent(inp)));
  document.getElementById('output').value = encoded;
  updateCount();
  toast('Encode به Base64 انجام شد ✅');
}

// ─── JSON → Links ─────────────────────────────────────────────────
function jsonToLinks() {
  const inp = document.getElementById('input').value.trim();
  if (!inp) return toast('ابتدا JSON را وارد کن', 'error');

  let json;
  // Try base64 decode first
  try {
    const decoded = atob(inp.replace(/\s/g,''));
    if (decoded.includes('://') || decoded.includes('{')) {
      try { json = JSON.parse(decoded); } catch(e) {
        const links = decoded.split('\n').filter(l => l.includes('://'));
        if (links.length) {
          document.getElementById('output').value = links.join('\n');
          updateCount();
          toast(links.length + ' لینک استخراج شد ✅');
          return;
        }
      }
    }
  } catch(e) {}

  if (!json) {
    try { json = JSON.parse(inp); }
    catch(e) { return toast('JSON معتبر نیست: ' + e.message, 'error'); }
  }

  const configs = extractConfigs(json);
  if (!configs.length) return toast('هیچ کانفیگی پیدا نشد!', 'error');
  document.getElementById('output').value = configs.join('\n');
  updateCount();
  toast(configs.length + ' لینک استخراج شد ✅');
}

// ─── Links → JSON ─────────────────────────────────────────────────
function linksToJson() {
  const inp = document.getElementById('input').value.trim();
  if (!inp) return toast('ابتدا لینک‌ها را وارد کن', 'error');

  const lines = inp.split('\n').map(l => l.trim()).filter(l => l.includes('://'));
  if (!lines.length) return toast('هیچ لینکی پیدا نشد!', 'error');

  const outbounds = lines.map(link => linkToOutbound(link)).filter(Boolean);
  if (!outbounds.length) return toast('لینک‌ها قابل تبدیل نیستند!', 'error');

  const config = {
    log: { loglevel: 'warning' },
    inbounds: [
      { tag: 'socks', port: 10808, listen: '127.0.0.1', protocol: 'socks', settings: { auth: 'noauth', udp: true } },
      { tag: 'http', port: 10809, listen: '127.0.0.1', protocol: 'http' }
    ],
    outbounds: outbounds,
    routing: { domainStrategy: 'IPIfNonMatch', rules: [] }
  };

  document.getElementById('output').value = JSON.stringify(config, null, 2);
  updateCount();
  toast(outbounds.length + ' کانفیگ به JSON تبدیل شد ✅');
}

// ─── Extract configs from JSON ────────────────────────────────────
function extractConfigs(json) {
  const configs = [];
  if (Array.isArray(json.outbounds)) json.outbounds.forEach(ob => { const l = outboundToLink(ob); if(l) configs.push(l); });
  if (Array.isArray(json.inbounds))  json.inbounds.forEach(ob  => { const l = outboundToLink(ob); if(l) configs.push(l); });
  if (Array.isArray(json))           json.forEach(ob           => { const l = outboundToLink(ob); if(l) configs.push(l); });
  if (!configs.length) { const l = outboundToLink(json); if(l) configs.push(l); }
  return configs;
}

function outboundToLink(ob) {
  if (!ob || typeof ob !== 'object') return null;
  const proto = (ob.protocol || ob.type || '').toLowerCase();
  if (proto === 'vless')                         return vlessToLink(ob);
  if (proto === 'vmess')                         return vmessToLink(ob);
  if (proto === 'trojan')                        return trojanToLink(ob);
  if (proto === 'shadowsocks' || proto === 'ss') return ssToLink(ob);
  return null;
}

function vlessToLink(ob) {
  try {
    const vnext = (ob.settings?.vnext || [])[0]; if (!vnext) return null;
    const user  = (vnext.users || [])[0];         if (!user)  return null;
    const stream = ob.streamSettings || {};
    const net = stream.network || 'tcp';
    const security = stream.security || 'none';
    const params = new URLSearchParams();
    params.set('type', net);
    if (security !== 'none') params.set('security', security);
    const tlsS = stream.tlsSettings || stream.realitySettings || {};
    if (tlsS.serverName)  params.set('sni', tlsS.serverName);
    if (tlsS.fingerprint) params.set('fp', tlsS.fingerprint);
    if (security === 'reality') {
      if (tlsS.publicKey) params.set('pbk', tlsS.publicKey);
      if (tlsS.shortId)   params.set('sid', tlsS.shortId);
    }
    if (net === 'ws') {
      const ws = stream.wsSettings || {};
      if (ws.path) params.set('path', ws.path);
      if (ws.headers?.Host) params.set('host', ws.headers.Host);
    } else if (net === 'grpc') {
      const g = stream.grpcSettings || {};
      if (g.serviceName) params.set('serviceName', g.serviceName);
    } else if (net === 'http' || net === 'h2') {
      const h = stream.httpSettings || {};
      if (h.path) params.set('path', h.path);
      if (h.host?.[0]) params.set('host', h.host[0]);
    }
    if (user.flow) params.set('flow', user.flow);
    const tag = encodeURIComponent(ob.tag || `VLESS-${vnext.address}`);
    return `vless://${user.id}@${vnext.address}:${vnext.port}?${params}#${tag}`;
  } catch(e) { return null; }
}

function vmessToLink(ob) {
  try {
    const vnext = (ob.settings?.vnext || [])[0]; if (!vnext) return null;
    const user  = (vnext.users || [])[0];         if (!user)  return null;
    const stream = ob.streamSettings || {};
    const net = stream.network || 'tcp';
    const tls = stream.security || 'none';
    const ws = stream.wsSettings || {};
    const grpc = stream.grpcSettings || {};
    const http = stream.httpSettings || {};
    const tlsS = stream.tlsSettings || {};
    const obj = {
      v:'2', ps: ob.tag || `VMess-${vnext.address}`,
      add: vnext.address, port: String(vnext.port),
      id: user.id, aid: String(user.alterId||0),
      scy: user.security||'auto', net, type:'none',
      host: ws.headers?.Host || http.host?.[0] || tlsS.serverName || '',
      path: ws.path || http.path || grpc.serviceName || '',
      tls: tls==='tls'?'tls':'', sni: tlsS.serverName||'',
      alpn: (tlsS.alpn||[]).join(','), fp: tlsS.fingerprint||''
    };
    return 'vmess://' + btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
  } catch(e) { return null; }
}

function trojanToLink(ob) {
  try {
    const server = (ob.settings?.servers || [])[0]; if (!server) return null;
    const stream = ob.streamSettings || {};
    const net = stream.network || 'tcp';
    const security = stream.security || 'tls';
    const tlsS = stream.tlsSettings || {};
    const params = new URLSearchParams();
    params.set('type', net); params.set('security', security);
    if (tlsS.serverName) params.set('sni', tlsS.serverName);
    if (net === 'ws') {
      const ws = stream.wsSettings || {};
      if (ws.path) params.set('path', ws.path);
      if (ws.headers?.Host) params.set('host', ws.headers.Host);
    }
    const tag = encodeURIComponent(ob.tag || `Trojan-${server.address}`);
    return `trojan://${server.password}@${server.address}:${server.port}?${params}#${tag}`;
  } catch(e) { return null; }
}

function ssToLink(ob) {
  try {
    const server = (ob.settings?.servers || [])[0]; if (!server) return null;
    const userinfo = btoa(`${server.method}:${server.password}`);
    const tag = encodeURIComponent(ob.tag || `SS-${server.address}`);
    return `ss://${userinfo}@${server.address}:${server.port}#${tag}`;
  } catch(e) { return null; }
}

// ─── Links → Outbound ────────────────────────────────────────────
function linkToOutbound(link) {
  try {
    if (link.startsWith('vless://'))  return vlessLinkToOutbound(link);
    if (link.startsWith('vmess://'))  return vmessLinkToOutbound(link);
    if (link.startsWith('trojan://')) return trojanLinkToOutbound(link);
    if (link.startsWith('ss://'))     return ssLinkToOutbound(link);
    return null;
  } catch(e) { return null; }
}

function vlessLinkToOutbound(link) {
  const url = new URL(link);
  const p = url.searchParams;
  const net = p.get('type') || 'tcp';
  const security = p.get('security') || 'none';
  const tag = decodeURIComponent(url.hash.slice(1)) || 'vless';

  const streamSettings = { network: net, security };
  if (security === 'tls' || security === 'reality') {
    const tlsKey = security === 'reality' ? 'realitySettings' : 'tlsSettings';
    streamSettings[tlsKey] = { serverName: p.get('sni')||'', fingerprint: p.get('fp')||'' };
    if (security === 'reality') {
      streamSettings[tlsKey].publicKey = p.get('pbk')||'';
      streamSettings[tlsKey].shortId = p.get('sid')||'';
    }
  }
  if (net === 'ws') streamSettings.wsSettings = { path: p.get('path')||'/', headers: { Host: p.get('host')||'' } };
  else if (net === 'grpc') streamSettings.grpcSettings = { serviceName: p.get('serviceName')||'' };

  return {
    tag, protocol: 'vless',
    settings: { vnext: [{ address: url.hostname, port: parseInt(url.port), users: [{ id: url.username, encryption: 'none', flow: p.get('flow')||'' }] }] },
    streamSettings
  };
}

function vmessLinkToOutbound(link) {
  const b64 = link.replace('vmess://', '');
  const obj = JSON.parse(decodeURIComponent(escape(atob(b64))));
  const net = obj.net || 'tcp';
  const streamSettings = { network: net, security: obj.tls||'none' };
  if (obj.tls) streamSettings.tlsSettings = { serverName: obj.sni||obj.host||'' };
  if (net === 'ws') streamSettings.wsSettings = { path: obj.path||'/', headers: { Host: obj.host||'' } };
  else if (net === 'grpc') streamSettings.grpcSettings = { serviceName: obj.path||'' };

  return {
    tag: obj.ps || 'vmess', protocol: 'vmess',
    settings: { vnext: [{ address: obj.add, port: parseInt(obj.port), users: [{ id: obj.id, alterId: parseInt(obj.aid||0), security: obj.scy||'auto' }] }] },
    streamSettings
  };
}

function trojanLinkToOutbound(link) {
  const url = new URL(link);
  const p = url.searchParams;
  const net = p.get('type') || 'tcp';
  const streamSettings = { network: net, security: p.get('security')||'tls', tlsSettings: { serverName: p.get('sni')||'' } };
  if (net === 'ws') streamSettings.wsSettings = { path: p.get('path')||'/', headers: { Host: p.get('host')||'' } };

  return {
    tag: decodeURIComponent(url.hash.slice(1)) || 'trojan', protocol: 'trojan',
    settings: { servers: [{ address: url.hostname, port: parseInt(url.port), password: url.username }] },
    streamSettings
  };
}

function ssLinkToOutbound(link) {
  const url = new URL(link);
  const decoded = atob(url.username);
  const [method, ...passArr] = decoded.split(':');
  const password = passArr.join(':');
  return {
    tag: decodeURIComponent(url.hash.slice(1)) || 'ss', protocol: 'shadowsocks',
    settings: { servers: [{ address: url.hostname, port: parseInt(url.port), method, password }] },
    streamSettings: { network: 'tcp' }
  };
}
</script>
